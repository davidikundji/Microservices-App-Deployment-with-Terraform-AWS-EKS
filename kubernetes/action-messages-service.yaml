apiVersion: v1
kind: Service
metadata:
  name: action-messages
  namespace: techpathway
  labels:
    app: action-messages
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: action-messages
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5001
  externalTrafficPolicy: Cluster