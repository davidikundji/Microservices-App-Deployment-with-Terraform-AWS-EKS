apiVersion: v1
kind: Service
metadata:
  name: techpathway-warehouse
  namespace: techpathway
  labels:
    app: techpathway-warehouse
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: techpathway-warehouse
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5002
  externalTrafficPolicy: Cluster