apiVersion: apps/v1
kind: Deployment
metadata:
  name: weekly-call
  namespace: techpathway
  labels:
    app: weekly-call
    app.kubernetes.io/part-of: techpathway-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: weekly-call

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: weekly-call
        app.kubernetes.io/part-of: techpathway-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      containers:
        - name: weekly-call
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/weekly-call:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5111
              protocol: TCP

          envFrom:
            - configMapRef:
                name: techpathway-config
            - secretRef:
                name: techpathway-secrets

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
