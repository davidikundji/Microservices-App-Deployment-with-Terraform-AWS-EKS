apiVersion: apps/v1
kind: Deployment
metadata:
  name: techpathway-warehouse
  namespace: techpathway
  labels:
    app: techpathway-warehouse
    app.kubernetes.io/part-of: techpathway-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: techpathway-warehouse

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: techpathway-warehouse
        app.kubernetes.io/part-of: techpathway-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      containers:
        - name: techpathway-warehouse
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/techpathway-warehouse:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
